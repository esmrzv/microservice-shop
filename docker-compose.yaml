services:
  shop-postgres:
    image: postgres:17
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql



  redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data



  migrate-auth:
    image: migrate/migrate
    depends_on:
      shop-postgres:
          condition: service_healthy
    volumes:
      - ./auth-service/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@shop-postgres:5432/auth_db?sslmode=disable",
        "up"
      ]


  migrate-product:
    image: migrate/migrate
    depends_on:
      shop-postgres:
        condition: service_healthy
    volumes:
      - ./product-service/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@shop-postgres:5432/product_db?sslmode=disable",
        "up"
      ]

  migrate-cart:
    image: migrate/migrate
    depends_on:
      shop-postgres:
        condition: service_healthy
    volumes:
      - ./cart-service/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@shop-postgres:5432/cart_db?sslmode=disable",
        "up"
      ]

  auth-service:
    build:
      context:  ./auth-service/
      dockerfile: Dockerfile
    env_file:
      - ./auth-service/.env.docker
    ports:
      - "8080:8080"
    depends_on:
      shop-postgres:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: ./product-service/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ./product-service/.env.docker
    depends_on:
      shop-postgres:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: ./cart-service/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ./cart-service/.env.docker
    depends_on:
      shop-postgres:
        condition: service_healthy
      product-service:
        condition: service_started




volumes:
  postgres-data:
  redis-data: