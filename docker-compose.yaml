services:
  auth-postgres:
    image: postgres:17
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    depends_on:
       auth-postgres:
          condition: service_healthy
    volumes:
      - ./auth-service/migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@auth-postgres:5432/auth_db?sslmode=disable",
        "up"
      ]

  auth-service:
    build:
      context:  ./auth-service/
      dockerfile: Dockerfile
    env_file:
      - ./auth-service/.env
    ports:
      - "8080:8080"
    depends_on:
      auth-postgres:
        condition: service_healthy




volumes:
  postgres-data: