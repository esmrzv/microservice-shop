syntax = "proto3";
package product;
option go_package = "githab.com/esmrzv/microservice-shop/proto/product";


message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  string id = 1;
  string name = 2;
  double price = 3;
}

service ProductService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
}